# The four credentials. `art` is the card face — a webp derivative under
# assets/img/credentials/, generated from the master in _src/img/credentials/
# by _src/optimize.sh. `google` decides whether the beta caveat is shown.
#
# There is no `formats` key any more. Naming the credential type ids on the
# card said more about foundry's configuration than about what the credential
# is; the bodies still describe the two-format credentials where that is the
# interesting part.
#
# There is no `face` key any more. It used to select a flat brand-colour ground
# in CSS because three of the four had only a logo and the fourth had no
# artwork at all; every credential now ships a complete card face, so the
# ground would only ever be hidden behind it.

- id: girocard
  name: "Sparkassen-Card"
  subtitle: "girocard"
  section: "Payments"
  art: "/assets/img/credentials/sparkassencard.webp"
  attests: "A payment card drawn on your account."
  wallets: "Any OpenID4VC wallet, and Google Wallet"
  google: true
  used_for: "Paying at Larder."
  body: >-
    Issued in **two formats that share no claims at all**. One carries
    `credential_id`, `network` and `card_id`; the other carries `sub`,
    `masked_iban` and `psu_id`. Not a superset of each other, not a rename —
    two different answers to the same question. Neither format ever discloses a
    full IBAN.

- id: wero
  name: "Wero"
  subtitle: "account-to-account payment"
  section: "Payments"
  art: "/assets/img/credentials/wero.webp"
  attests: "A payment instrument drawn on your account."
  wallets: "Any OpenID4VC wallet"
  google: false
  used_for: "Paying at Larder."
  body: >-
    A second way to pay, drawn on the account itself rather than on a card. It
    carries the same claims as the Sparkassen-Card's second format — `sub`,
    `masked_iban` and `psu_id` — so the shop tells the two apart by *which
    question they answered*, never by what is inside them.

- id: age
  name: "Age verification"
  subtitle: "an attestation, not an identity"
  section: "Credentials"
  art: "/assets/img/credentials/av.webp"
  attests: "That you are over 16, and that you are over 18. Nothing else."
  wallets: "Any OpenID4VC wallet, and Google Wallet"
  google: true
  used_for: "Buying beer, wine or aperitif at Larder."
  body: >-
    Two booleans and no date of birth, no name, no document number. Issued in
    two formats whose claims are **byte-identical** — one attestation in two
    wrappers, one for each wallet. The shop learns that you are old enough and
    learns nothing else about you, which is the entire point of asking this way.

- id: authenticator
  name: "Sparkassen Authenticator"
  subtitle: "one claim, and it is not your name"
  section: "Credentials"
  art: "/assets/img/credentials/authenticator.webp"
  attests: "That you are an authenticated customer of this bank."
  wallets: "Any OpenID4VC wallet"
  google: false
  used_for: "Logging in to the bank without a password."
  body: >-
    Its entire content is a single opaque identifier, `sub`, minted fresh for
    each issuance — so two of these credentials cannot be linked to each other
    by anyone who sees both. It authenticates rather than pays: the bank refuses
    a debit against it even though it is a perfectly valid credential, so the
    money still has to be authorised by a payment credential. Issued for 365
    days, and nothing in this demo can revoke it.
