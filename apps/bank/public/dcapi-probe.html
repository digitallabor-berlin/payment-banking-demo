<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC API probe</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 1.5rem; }
  h1 { font-size: 1.1rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #ddd;
           font-family: ui-monospace, Menlo, monospace; font-size: 13px;
           word-break: break-all; }
  th { background: #f5f5f5; }
  .t { color: #0a7d2c; font-weight: 700; }
  .f { color: #c40c0c; font-weight: 700; }
  .n { color: #888; }
  pre { background: #f5f5f5; padding: .6rem; overflow-x: auto; font-size: 12px; }
  button { font: inherit; padding: .5rem 1rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Digital Credentials API probe</h1>
<p>Open this page on the device in question and send back the block at the bottom.</p>
<table id="out"></table>
<button id="copy">Copy report</button>
<pre id="report"></pre>

<script>
(function () {
  var rows = [];
  function add(k, v) { rows.push([k, v]); }

  /**
   * Builds one cell as a real DOM node. Every probe value — the user agent
   * string above all — reaches the page through textContent, never through
   * parsed markup.
   */
  function cell(tag, v) {
    var el = document.createElement(tag);
    if (v === true || v === false || v === null || v === undefined) {
      var span = document.createElement('span');
      span.className = v === true ? 't' : v === false ? 'f' : 'n';
      span.textContent = String(v);
      el.appendChild(span);
    } else {
      el.textContent = String(v);
    }
    return el;
  }

  add('userAgent', navigator.userAgent);
  add('isSecureContext', window.isSecureContext);
  add('typeof DigitalCredential', typeof window.DigitalCredential);
  add('navigator.credentials', typeof navigator.credentials);
  add('credentials.get', typeof (navigator.credentials || {}).get);
  add('credentials.create', typeof (navigator.credentials || {}).create);

  var DC = window.DigitalCredential;
  var hasUA = !!(DC && typeof DC.userAgentAllowsProtocol === 'function');
  add('userAgentAllowsProtocol present', hasUA);

  // The exact identifiers this demo feature-detects against, plus controls.
  var PROTOCOLS = [
    'openid4vp-v1-signed',       // bank + shop default (Gate B)
    'openid4vp-v1-unsigned',     // ?dcapi=unsigned
    'openid4vp-v1-multisigned',
    'openid4vci-v1',             // issuance (Gate A)
    'org-iso-mdoc',              // the one Safari documents support for
    'totally-bogus-protocol-xyz' // control: true here means rubber stamp
  ];

  PROTOCOLS.forEach(function (p) {
    if (!hasUA) { add('allows ' + p, 'n/a'); return; }
    var r;
    try { r = Boolean(DC.userAgentAllowsProtocol(p)); }
    catch (e) { r = 'threw: ' + (e && e.name); }
    add('allows ' + p, r);
  });

  // Reproduces supportsDcApi() exactly as shipped, for both gates.
  function supportsDcApi(method, protocol) {
    if (!window.isSecureContext) return false;
    if (!DC) return false;
    var c = navigator.credentials;
    if (!c) return false;
    if (typeof c[method] !== 'function') return false;
    if (method === 'create') return true;
    if (!hasUA) return true;
    try { return Boolean(DC.userAgentAllowsProtocol(protocol)); }
    catch (e) { return false; }
  }

  add('=> supportsDcApi("get","openid4vp-v1-signed")',
      supportsDcApi('get', 'openid4vp-v1-signed'));
  add('=> supportsDcApi("get","openid4vp-v1-unsigned")',
      supportsDcApi('get', 'openid4vp-v1-unsigned'));
  add('=> supportsDcApi("create","openid4vci-v1")',
      supportsDcApi('create', 'openid4vci-v1'));

  var table = document.querySelector('#out');
  var head = document.createElement('tr');
  head.appendChild(cell('th', 'check'));
  head.appendChild(cell('th', 'value'));
  table.appendChild(head);
  rows.forEach(function (r) {
    var tr = document.createElement('tr');
    tr.appendChild(cell('td', r[0]));
    tr.appendChild(cell('td', r[1]));
    table.appendChild(tr);
  });

  var text = rows.map(function (r) { return r[0] + ' = ' + String(r[1]); }).join('\n');
  document.querySelector('#report').textContent = text;
  document.querySelector('#copy').onclick = function () {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    this.textContent = 'Copied';
  };
})();
</script>
</body>
</html>
