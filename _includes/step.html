<li class="step">
  <div class="step__n" aria-hidden="true">{{ include.step.n }}</div>
  <div class="step__body">
    <h3>{{ include.step.title }}</h3>
    {{ include.step.body | markdownify }} {%- if include.step.shots %}
    <div class="shots">
      {%- for shot in include.step.shots %}
      <figure class="shot shot--{{ shot.kind }}">
        {%- comment -%} Empty alt on purpose: the figcaption below is the
        description, and a screen reader announcing both reads the same sentence
        twice. See the header comment in _data/steps.yml. {%- endcomment -%}
        <img
          src="{{ shot.src | relative_url }}"
          alt=""
          loading="lazy"
          decoding="async"
        />
        <figcaption>{{ shot.caption }}</figcaption>
      </figure>
      {%- endfor %}
    </div>
    {%- endif %}
  </div>
</li>
